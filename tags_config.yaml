# Конфигурация ArUco-маркеров на потолке
# Для каждой метки задаются координаты (x, y, z) и углы Эйлера (roll, pitch, yaw) в радианах
# Высота потолка: z = 2.5 м. Метки развернуты лицом в пол (roll = 3.14159)

tags:
  tag_1:
    enabled: false
    x: 2.0
    y: 1.0
    z: 2.5
    roll: 3.1415926
    pitch: 0.0
    yaw: 0.0
  tag_2:
    enabled: false
    x: -1.0
    y: 2.0
    z: 2.5
    roll: 3.1415926
    pitch: 0.0
    yaw: 0.0
  tag_3:
    enabled: false
    x: -2.0
    y: -1.0
    z: 2.5
    roll: 3.1415926
    pitch: 0.0
    yaw: 0.0
  
  # Реальная потолочная метка 17 в тестовой зоне (активна)
  tag_17:
    enabled: true
    x: 0.0
    y: 0.0
    z: 2.5
    roll: 3.1415926
    pitch: 0.0
    yaw: 0.0

  # Реальная метка 67 (отключена до точного физического замера координат)
  tag_67:
    enabled: false
    x: 0.0
    y: 0.0
    z: 2.5
    roll: 3.1415926
    pitch: 0.0
    yaw: 0.0
